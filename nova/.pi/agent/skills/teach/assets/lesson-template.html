<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
/* Design rules live in references/lesson-design.md. Change them there first, then here. */
:root{
--base:#1e1e2e;--mantle:#181825;--crust:#11111b;--s0:#313244;--s1:#45475a;--s2:#585b70;
--ov:#9399b2;--sub:#bac2de;--text:#cdd6f4;
--accent:#fab387;--accent-ink:#11111b;--accent-soft:rgba(250,179,135,.08);--err:#f38ba8;
--mauve:#cba6f7;--blue:#89b4fa;--green:#a6e3a1;--peach:#fab387;--yellow:#f9e2af;--red:#f38ba8;
--sky:#89dceb;--flamingo:#f2cdcd;--teal:#94e2d5;--comment:#7f849c;
--r-lg:12px;--r-md:8px;--r-sm:6px;
--ease:cubic-bezier(.16,1,.3,1);
--sans:"SF Pro Display","SF Pro Text",system-ui,sans-serif;
--mono:"ZedMono Nerd Font Mono","ZedMono Nerd Font","JetBrainsMono Nerd Font",ui-monospace,monospace}
*{box-sizing:border-box}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--base);color:var(--text);font:17px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* progress: thin line, no track */
.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:10;pointer-events:none}
.progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .5s var(--ease)}

/* layout: outline rail + reading column */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:64px;max-width:1100px;margin:0 auto;padding:64px 32px 112px}
main{max-width:70ch;min-width:0}
.rail{position:sticky;top:48px;align-self:start;font-size:14px;line-height:1.45}
.rail h2{font-size:13px;font-weight:600;color:var(--ov);margin:0 0 12px}
.rail ol{list-style:none;margin:0;padding:0;border-left:1px solid var(--s0)}
.rail a{display:flex;align-items:center;gap:10px;padding:6px 0 6px 14px;margin-left:-1px;border-left:2px solid transparent;color:var(--ov);text-decoration:none;transition:color .2s var(--ease),border-color .2s var(--ease)}
.rail a:hover{color:var(--text)}
.rail li.sec a{color:var(--sub);font-weight:600;padding-top:14px}
.rail li.current a{color:var(--text);border-left-color:var(--accent)}
.rail .num{width:20px;height:20px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid var(--s2);font:600 11px var(--mono);transition:background .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease)}
.rail li.done .num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tally{margin:20px 0 0;color:var(--sub);font-size:14px}

/* type */
.intro{padding-bottom:32px;margin-bottom:40px;border-bottom:1px solid var(--s0)}
h1{font-size:clamp(32px,4vw,44px);line-height:1.1;letter-spacing:-.02em;font-weight:700;margin:0 0 14px}
.goal{font-size:19px;line-height:1.55;color:var(--sub);margin:0 0 18px}
.meta{font-size:14px;color:var(--ov);margin:0}
h2{font-size:24px;line-height:1.25;letter-spacing:-.01em;margin:56px 0 12px;scroll-margin-top:32px}
h3{font-size:19px;margin:36px 0 8px}
p,ul,ol{margin:0 0 16px}
main>ul,main>ol{padding-left:22px}
li{margin:4px 0}
strong{color:var(--accent);font-weight:600}
.key{background:var(--mantle);border:1px solid var(--s0);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:14px 20px;margin:24px 0}
.key::before{content:"Key idea";display:block;font-size:13px;font-weight:600;color:var(--accent);margin-bottom:2px}
.key p:last-child{margin-bottom:0}

/* code */
code{font-family:var(--mono);font-size:.9em}
:not(pre)>code{background:var(--s0);padding:2px 6px;border-radius:var(--r-sm)}
pre{background:var(--mantle);border:1px solid var(--s0);border-radius:var(--r-md);padding:16px 18px;margin:0 0 20px;overflow-x:auto;font:15px/1.6 var(--mono);tab-size:4}
pre code{background:none;padding:0;font-size:inherit;color:var(--text)}
pre.numbered{display:flex;gap:16px}
pre .ln{color:var(--s2);text-align:right;user-select:none;flex:none;white-space:pre}
.hljs-keyword,.hljs-selector-tag,.hljs-meta .hljs-keyword{color:var(--mauve)}
.hljs-string,.hljs-regexp,.hljs-char{color:var(--green)}
.hljs-number,.hljs-literal{color:var(--peach)}
.hljs-comment,.hljs-quote{color:var(--comment);font-style:italic}
.hljs-title.function_,.hljs-title,.hljs-section{color:var(--blue)}
.hljs-title.class_,.hljs-type{color:var(--yellow)}
.hljs-built_in{color:var(--red)}
.hljs-variable,.hljs-params,.hljs-template-variable{color:var(--flamingo)}
.hljs-attr,.hljs-property,.hljs-attribute{color:var(--teal)}
.hljs-operator{color:var(--sky)}
.hljs-meta{color:var(--peach)}
.hljs-subst{color:var(--text)}

/* exercises */
.ex{background:var(--mantle);border:1px solid var(--s0);border-radius:var(--r-lg);padding:22px 24px;margin:32px 0;scroll-margin-top:32px;transition:border-color .3s var(--ease)}
.ex.done{border-color:var(--s1)}
.ex pre{background:var(--crust)}
.ex-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;font-weight:600;color:var(--sub)}
.ex-num{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid var(--s2);font:600 12px var(--mono);transition:background .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease)}
.ex.done .ex-num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ex>p:first-of-type{font-size:18px;margin-top:0}
.field-label{display:block;font-size:14px;font-weight:600;color:var(--sub);margin:4px 0 8px}
.hint{font-size:13px;color:var(--ov);margin:8px 0 0}

.quiz ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.quiz li{margin:0}
/* scoped to li: the confidence .seg labels must not inherit option styles */
.quiz li label{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--s0);border-radius:var(--r-md);background:var(--base);cursor:pointer;transition:border-color .2s var(--ease),background .2s var(--ease),transform .1s}
.quiz li label:hover{border-color:var(--s2)}
.quiz li label:active{transform:scale(.99)}
.quiz li label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.quiz li label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.quiz li input{position:absolute;opacity:0;pointer-events:none}
.quiz .letter{width:24px;height:24px;flex:none;border-radius:var(--r-sm);display:grid;place-items:center;border:1px solid var(--s1);font:600 12px var(--mono);color:var(--sub);transition:background .2s var(--ease),color .2s var(--ease)}
.quiz li label:has(input:checked) .letter{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.answer,textarea.plain{display:block;resize:vertical;width:100%;background:var(--base);color:var(--text);border:1px solid var(--s1);border-radius:var(--r-md);padding:12px 14px;font:15px/1.6 var(--mono);transition:border-color .2s var(--ease)}
textarea.plain{min-height:110px;font:16px/1.6 var(--sans);resize:vertical}
.answer:focus,textarea.plain:focus{outline:none;border-color:var(--accent)}
::placeholder{color:var(--ov)}

.editor{position:relative}
.editor pre{margin:0;pointer-events:none;white-space:pre-wrap;word-break:break-word;min-height:4em}
/* padding + border equal the <pre> so the caret sits on the coloured text */
.editor textarea{position:absolute;inset:0;margin:0;padding:16px 18px;border:1px solid transparent;border-radius:var(--r-md);background:transparent;color:transparent;caret-color:var(--text);resize:none;outline:none;overflow:hidden;font:15px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;tab-size:4;transition:border-color .2s var(--ease)}
.editor textarea:focus{border-color:var(--accent)}
.editor textarea::selection{background:rgba(250,179,135,.25);color:transparent}

.order ol{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.order li{display:flex;align-items:center;gap:6px;margin:0;padding:6px 6px 6px 14px;background:var(--crust);border:1px solid var(--s0);border-radius:var(--r-md)}
.order li code{flex:1;white-space:pre;overflow-x:auto;background:none;padding:0;font-size:15px}
.order button{width:32px;height:32px;flex:none;background:var(--s0);color:var(--sub);border:1px solid var(--s1);border-radius:var(--r-sm);cursor:pointer;font:16px var(--sans);transition:border-color .2s var(--ease),color .2s var(--ease),transform .1s}
.order button:hover{border-color:var(--accent);color:var(--text)}
.order button:active{transform:translateY(1px)}

.conf{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--s0);font-size:14px;color:var(--sub)}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--s1);border-radius:var(--r-md)}
.seg label{position:relative;padding:3px 12px;border-radius:var(--r-sm);cursor:pointer;transition:background .2s var(--ease),color .2s var(--ease)}
.seg label:hover{color:var(--text)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--s1);color:var(--text)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:1px}

/* finish */
.finish{margin-top:56px;padding:28px;background:var(--mantle);border:1px solid var(--s0);border-radius:var(--r-lg);display:grid;gap:12px;justify-items:start}
.finish h2{margin:0;font-size:22px}
.finish p{margin:0;color:var(--sub)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r-md);padding:12px 22px;font:600 16px var(--sans);cursor:pointer;transition:transform .1s,filter .2s var(--ease)}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:progress}
#status{min-height:1.5em;font-size:15px}
#status.ok{color:var(--text)}
#status.err{color:var(--err)}

@media (max-width:900px){
.shell{grid-template-columns:1fr;gap:0;padding:40px 20px 80px}
.rail{display:none}
.ex{padding:18px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="progress" aria-hidden="true"><span></span></div>
<div class="shell">
<nav class="rail" aria-label="Lesson outline"></nav>
<main>
<!--LESSON-->
</main>
</div>
<script>
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids);
  return e;
};
// Put plain text in a <code> and let highlight.js colour it (it escapes the text itself).
const paint = (code, text, lang) => {
  code.textContent = text;
  if (!window.hljs) return;
  code.className = lang && hljs.getLanguage(lang) ? "language-" + lang : "";
  delete code.dataset.highlighted;
  hljs.highlightElement(code);
};
const LABELS = {quiz: "Quiz", predict: "Predict the output", complete: "Complete the code", order: "Put the lines in order", "explain-back": "Explain it back"};
const main = document.querySelector("main");
const exs = $$("main .ex");
exs.forEach((ex, i) => {
  if (!ex.id) ex.id = "ex" + (i + 1);
  ex.dataset.type = Object.keys(LABELS).find(t => ex.classList.contains(t)) || "explain-back";
});

const h1 = main.querySelector("h1");
document.title = h1 ? h1.textContent : "Lesson";

// Static code blocks: highlight + line numbers.
for (const code of $$("main pre > code")) {
  if (window.hljs) hljs.highlightElement(code);
  const n = code.textContent.replace(/\n$/, "").split("\n").length;
  if (n > 1) {
    code.parentElement.prepend(el("span", {className: "ln", textContent: Array.from({length: n}, (_, i) => i + 1).join("\n")}));
    code.parentElement.classList.add("numbered");
  }
}

// Intro: title, goal, honest meta line.
if (h1) {
  const intro = el("header", {className: "intro"});
  h1.before(intro);
  intro.append(h1);
  const goal = main.querySelector(":scope > p.goal");
  if (goal) intro.append(goal);
  if (exs.length) {
    intro.append(el("p", {className: "meta", textContent:
      `${exs.length} exercise${exs.length === 1 ? "" : "s"}. Try each one before looking anything up: a wrong first guess still helps the right answer stick.`}));
  }
}

exs.forEach((ex, i) => {
  const type = ex.dataset.type;
  ex.prepend(el("div", {className: "ex-head"}, el("span", {className: "ex-num", textContent: String(i + 1)}), LABELS[type]));

  if (type === "quiz") {
    $$("li", ex).forEach((li, j) => {
      const letter = String.fromCharCode(65 + j);
      const opt = el("span", {className: "opt"}, ...li.childNodes);
      li.append(el("label", {},
        el("input", {type: "radio", name: ex.id, value: letter}),
        el("span", {className: "letter", textContent: letter}),
        opt));
    });
  } else if (type === "predict") {
    ex.append(
      el("label", {className: "field-label", htmlFor: ex.id + "-in", textContent: "Your prediction"}),
      el("textarea", {className: "answer", id: ex.id + "-in", rows: 3, placeholder: "Exactly what it prints, one line per output line", spellcheck: false}));
  } else if (type === "explain-back") {
    ex.append(
      el("label", {className: "field-label", htmlFor: ex.id + "-in", textContent: "Your explanation"}),
      el("textarea", {className: "plain", id: ex.id + "-in", placeholder: "In your own words"}));
  } else if (type === "complete") {
    const ta = ex.querySelector("textarea");
    const lang = ex.dataset.lang || "";
    const out = el("code");
    const wrap = el("div", {className: "editor"}, el("pre", {}, out));
    ta.replaceWith(wrap);
    wrap.append(ta);
    ta.spellcheck = false;
    ta.id = ex.id + "-in";
    ta.dataset.start = ta.value;
    wrap.before(el("label", {className: "field-label", htmlFor: ta.id, textContent: "Your code"}));
    const render = () => paint(out, ta.value + "\n ", lang);
    const insert = text => {
      ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, "end");
      ta.dispatchEvent(new Event("input", {bubbles: true}));
    };
    ta.addEventListener("input", render);
    ta.addEventListener("keydown", e => {
      if (e.key === "Tab" && !e.shiftKey) {
        e.preventDefault();
        insert("    ");
      } else if (e.key === "Enter") {
        const before = ta.value.slice(0, ta.selectionStart);
        const indent = before.slice(before.lastIndexOf("\n") + 1).match(/^\s*/)[0];
        e.preventDefault();
        insert("\n" + indent + (/[:{(\[]\s*$/.test(before) ? "    " : ""));
      } else if (e.key === "Escape") {
        ta.blur();
      }
    });
    render();
    ex.append(el("p", {className: "hint", textContent: "Replace each ___. Tab indents, Esc leaves the box."}));
  } else if (type === "order") {
    const ol = ex.querySelector("ol");
    const lines = $$("li", ol).map(li => li.textContent.replace(/^\n|\n$/g, ""));
    const lang = ex.dataset.lang || "";
    const shuffled = lines.slice();
    for (let t = 0; t < 10 && lines.length > 1 && shuffled.join("\n") === lines.join("\n"); t++) {
      for (let k = shuffled.length - 1; k > 0; k--) {
        const j = Math.floor(Math.random() * (k + 1));
        [shuffled[k], shuffled[j]] = [shuffled[j], shuffled[k]];
      }
    }
    const moved = () => { ex.dataset.touched = "1"; refresh(); };
    ol.replaceChildren(...shuffled.map(line => {
      const code = el("code");
      paint(code, line, lang);
      const up = el("button", {type: "button", textContent: "↑"});
      const down = el("button", {type: "button", textContent: "↓"});
      up.setAttribute("aria-label", "Move line up");
      down.setAttribute("aria-label", "Move line down");
      const li = el("li", {}, code, up, down);
      li.dataset.line = line;
      up.onclick = () => { if (li.previousElementSibling) ol.insertBefore(li, li.previousElementSibling); up.focus(); moved(); };
      down.onclick = () => { if (li.nextElementSibling) ol.insertBefore(li.nextElementSibling, li); down.focus(); moved(); };
      return li;
    }));
  }

  // Confidence: separates real knowledge from lucky guesses.
  const seg = el("div", {className: "seg"}, ...["sure", "unsure", "guessed"].map(v =>
    el("label", {}, el("input", {type: "radio", name: "conf-" + ex.id, value: v}), v)));
  seg.setAttribute("role", "radiogroup");
  seg.setAttribute("aria-label", "How sure are you?");
  ex.append(el("div", {className: "conf"}, "How sure are you?", seg));
});

function answered(ex) {
  const t = ex.dataset.type;
  if (t === "quiz") return !!ex.querySelector(`input[name="${CSS.escape(ex.id)}"]:checked`);
  if (t === "predict") return ex.querySelector(".answer").value.trim() !== "";
  if (t === "explain-back") return ex.querySelector("textarea").value.trim() !== "";
  if (t === "complete") { const ta = ex.querySelector("textarea"); return ta.value !== ta.dataset.start; }
  if (t === "order") return ex.dataset.touched === "1";
  return false;
}

// Outline rail: sections + exercises, with answered state.
const railMap = new Map();
const tally = el("p", {className: "tally"});
{
  const ol = el("ol");
  let n = 0;
  for (const node of $$("main h2, main .ex")) {
    let li;
    if (node.matches("h2")) {
      if (!node.id) node.id = "s" + railMap.size;
      li = el("li", {className: "sec"}, el("a", {href: "#" + node.id, textContent: node.textContent}));
    } else {
      li = el("li", {}, el("a", {href: "#" + node.id}, el("span", {className: "num", textContent: String(++n)}), LABELS[node.dataset.type]));
    }
    railMap.set(node, li);
    ol.append(li);
  }
  document.querySelector(".rail").append(el("h2", {textContent: "In this lesson"}), ol, tally);
  const io = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      for (const li of railMap.values()) li.classList.remove("current");
      railMap.get(e.target).classList.add("current");
    }
  }, {rootMargin: "-25% 0px -65% 0px"});
  for (const node of railMap.keys()) io.observe(node);
}

function collect() {
  return exs.map(ex => {
    const type = ex.dataset.type;
    let answer = null;
    if (type === "quiz") {
      const r = ex.querySelector(`input[name="${CSS.escape(ex.id)}"]:checked`);
      answer = r ? `${r.value}: ${r.closest("label").querySelector(".opt").textContent.trim()}` : null;
    } else if (type === "predict") {
      answer = ex.querySelector(".answer").value;
    } else if (type === "complete" || type === "explain-back") {
      answer = ex.querySelector("textarea").value;
    } else if (type === "order") {
      answer = $$("ol li", ex).map(li => li.dataset.line);
    }
    const c = ex.querySelector(`input[name="conf-${CSS.escape(ex.id)}"]:checked`);
    const p = ex.querySelector(":scope > p");
    return {id: ex.id, type, prompt: p ? p.textContent.trim() : "", answer, confidence: c ? c.value : null};
  });
}

// Finish panel.
const note = el("p");
if (exs.length) {
  const btn = el("button", {className: "btn", type: "button", textContent: "Submit answers"});
  const status = el("p", {id: "status"});
  status.setAttribute("role", "status");
  main.append(el("section", {className: "finish"}, el("h2", {textContent: "Send your answers"}), note, btn, status));
  btn.onclick = async () => {
    btn.disabled = true;
    btn.textContent = "Saving...";
    try {
      const res = await fetch("submit", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({title: document.title, submittedAt: new Date().toISOString(), answers: collect()}),
      });
      if (!res.ok) throw new Error(await res.text());
      status.className = "ok";
      status.textContent = "Saved. Your feedback is waiting in the terminal. You can change answers and submit again.";
      btn.textContent = "Submit again";
    } catch (e) {
      status.className = "err";
      status.textContent = "Could not save (" + e.message + "). Is the lesson server still running?";
      btn.textContent = "Try again";
    }
    btn.disabled = false;
  };
}

const bar = document.querySelector(".progress span");
function refresh() {
  let n = 0;
  for (const ex of exs) {
    const d = answered(ex);
    ex.classList.toggle("done", d);
    railMap.get(ex)?.classList.toggle("done", d);
    if (d) n++;
  }
  bar.style.width = exs.length ? (n / exs.length) * 100 + "%" : "0";
  tally.textContent = exs.length ? `${n} of ${exs.length} answered` : "";
  note.textContent = `${n} of ${exs.length} answered. Blank or unsure answers are fine: they show what to go over next.`;
}
main.addEventListener("input", refresh);
main.addEventListener("change", refresh);
refresh();
</script>
</body>
</html>
