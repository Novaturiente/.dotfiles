[keybindings]
scroll_up = "ctrl+shift+k"
scroll_down = "ctrl+shift+j"
scroll_page_up = "alt+u"
scroll_page_down = "alt+d"
model_switch_next = "ctrl+tab"
model_switch_prev = "ctrl+shift+tab"
fallback_switch = "ctrl+y"
effort_increase = "alt+right"
effort_decrease = "alt+left"
centered_toggle = "alt+c"
scroll_prompt_up = "ctrl+k"
scroll_prompt_down = "ctrl+j"
scroll_bookmark = "ctrl+g"
scroll_up_fallback = ""
scroll_down_fallback = ""
workspace_left = "alt+h"
workspace_down = "alt+j"
workspace_up = "alt+k"
workspace_right = "alt+l"
side_panel_toggle = "alt+m"
copy_selection_toggle = "alt+y"
diagram_pane_toggle = "alt+t"
typing_scroll_lock_toggle = "alt+s"
diff_mode_cycle = "alt+g"
info_widget_toggle = "alt+i"
todo_card_toggle = "alt+x"
swarm_panel_focus = "alt+n"
new_terminal = "alt+shift+;"
open_resume = "alt+r"
session_picker_enter = "current-terminal"

[dictation]
command = ""
mode = "send"
key = "off"
timeout_secs = 90

[display]
diff_mode = "inline"
queue_mode = false
auto_server_reload = true
mouse_capture = true
debug_socket = false
emoji = true
centered = false
show_thinking = false
reasoning_display = "current"
diagram_mode = "none"
markdown_spacing = "document"
latex_rendering = "image"
pin_images = true
pin_todos = false
idle_animation = false
prompt_entry_animation = true
disabled_animations = []
diff_line_wrap = true
performance = ""
animation_fps = 60
redraw_fps = 60
prompt_preview = true
compact_notifications = false
copy_badge_alt_label = ""
show_agentgrep_output = false
tool_call_details = false
keybinding_hints = true
theme = ""
active_sessions_manager = false
overscroll_status = "on"
input_border = "rounded"
assistant_gutter = "none"
session_picker_scope = "all"

[display.native_scrollbars]
chat = true
side_panel = true

[display.colors]

[features]
memory = true
swarm = true
mermaid = true
auto_poke = true
message_timestamps = true
persist_memory_injections = false
kv_cache_miss_notices = true
update_channel = "stable"

[websearch]
engine = "duckduckgo"
fallback_engines = ["bing"]
bing_api_key_env = "JCODE_BING_API_KEY"
bing_market = "en-US"
searxng_url_env = "JCODE_SEARXNG_URL"

[tools]
profile = ""
enabled = []
disabled = ["replace"]
disable_base_tools = false

[acp]
profile = "standard"
tool_profile = "acp"

[auth]
trusted_external_sources = []
trusted_external_source_paths = [
    "copilot_hosts_json|/home/nova/.jcode/scratch/.tmpbh7s3x/github-copilot/hosts.json",
    "copilot_hosts_json|/home/nova/.jcode/scratch/.tmpctfizw/github-copilot/hosts.json",
    "copilot_hosts_json|/home/nova/.jcode/scratch/.tmpcunsvi/github-copilot/hosts.json",
    "copilot_hosts_json|/home/nova/.jcode/scratch/.tmpegwwd6/github-copilot/hosts.json",
    "copilot_hosts_json|/home/nova/.jcode/scratch/.tmpinuol3/github-copilot/hosts.json",
    "copilot_hosts_json|/home/nova/.jcode/scratch/.tmpmkuhqy/github-copilot/hosts.json",
    "copilot_hosts_json|/home/nova/.jcode/scratch/.tmpt4qwe8/github-copilot/hosts.json",
    "copilot_hosts_json|/home/nova/.jcode/scratch/.tmpuwo3xt/github-copilot/hosts.json",
    "copilot_hosts_json|/home/nova/.jcode/scratch/.tmpvkznym/github-copilot/hosts.json",
    "copilot_hosts_json|/home/nova/.jcode/scratch/.tmpw5dalt/github-copilot/hosts.json",
]

[provider]
default_model = "claude-opus-5-5"
default_provider = "claude"
openai_reasoning_effort = "low"
anthropic_reasoning_effort = "medium"
openai_service_tier = "priority"
openai_native_compaction_mode = "auto"
openai_native_compaction_threshold_tokens = 200000
preserve_reasoning_context = true
cross_provider_failover = "countdown"
same_provider_account_failover = true
stream_idle_timeout_secs = 180

[providers]

[agents]
swarm_spawn_mode = "inline"
swarm_strip_layout = "vertical"
memory_sidecar_enabled = true
memory_rerank_cadence = 3
memory_rerank_votes = 2
memory_rerank_min_agree = 2
memory_embedding_backend = "local"
swarm_max_concurrent_agents = 32

[terminal]

[hooks]
pre_tool = "/home/nova/.jcode/hooks/coolify-push-detect.sh"
post_tool = "/home/nova/.jcode/hooks/coolify-push-monitor.sh"
pre_tool_timeout_ms = 5000

[skills]
# jcode owns its skill set independently. Claude Code plugins stay installed
# and keep working there; jcode just does not read them.
claude_plugins = false
claude_project = false
import_external = false

[ambient]
enabled = false
allow_api_keys = false
min_interval_minutes = 5
max_interval_minutes = 120
pause_on_active_session = true
proactive_work = true
work_branch_prefix = "ambient/"
visible = true

[safety]
ntfy_server = "https://ntfy.sh"
desktop_notifications = true
email_enabled = false
email_smtp_port = 587
email_imap_port = 993
email_reply_enabled = false
telegram_enabled = false
telegram_reply_enabled = false
discord_enabled = false
discord_reply_enabled = false
jade_relay_enabled = false
jade_relay_reply_enabled = false
jade_relay_launch_enabled = false

[notifications]
turn_complete = true
turn_complete_min_secs = 120
turn_complete_todo_min_secs = 30
turn_complete_only_when_unfocused = true
turn_complete_sound = "Glass"

[gateway]
enabled = false
port = 7643
bind_addr = "0.0.0.0"

[compaction]
mode = "reactive"
lookahead_turns = 15
ewma_alpha = 0.30000001192092896
proactive_floor = 0.4000000059604645
min_samples = 3
stall_window = 5
min_turns_between_compactions = 10
topic_shift_threshold = 0.44999998807907104
relevance_keep_threshold = 0.6499999761581421
goal_window_turns = 5

[power]
prevent_sleep_while_streaming = true

[autoreview]
enabled = false

[autojudge]
enabled = false

[launch_hotkeys]
enabled = true
imported = true

[[launch_hotkeys.entries]]
chord = "cmd+;"
dir = "/home/nova/.dotfiles"
label = ".dotfiles"
self_dev = false

[[launch_hotkeys.entries]]
chord = "cmd+'"
dir = "$HOME"
label = "home"
self_dev = false
