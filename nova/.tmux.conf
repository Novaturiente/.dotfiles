# tmux config — minimal, built for agent orchestration.

# Prefixes: backtick (primary) and C-b (default). Double backtick types one.
set -g prefix '`'
set -g prefix2 C-b
bind '`' send-prefix

# Terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g set-clipboard on

# Numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi copy mode, yank to Wayland clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Splits/windows open in current dir
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"

# Vim-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.tmux.conf \; display "reloaded"

# Agent sidebar: prefix+A sidebar, prefix+e popup. Clone: ~/.tmux/plugins/agenmux
# Hook covers first server start (config loads before any session exists);
# plain run-shell covers prefix+r reloads. %if keeps an already-expanded
# status line on reload (setup --if-needed would not re-expand it).
%if "#{!:#{m:*agenmux-runtime-bin*,#{status-right}}}"
set -g status-right "#{agenmux} %H:%M"
%endif
run-shell ~/.tmux/plugins/agenmux/agenmux.tmux
set-hook -g session-created[0] "run-shell ~/.tmux/plugins/agenmux/agenmux.tmux"
