# tmux config — minimal, built for agent orchestration.

# Prefixes: backtick (primary) and C-b (default). Double backtick types one.
set -g prefix '`'
set -g prefix2 C-b
bind '`' send-prefix

# Terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g set-clipboard on

# Numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi copy mode, yank to Wayland clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Splits/windows open in current dir
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"

# Vim-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.tmux.conf \; display "reloaded"
bind R run-shell ~/.config/tmux/autoreload.sh
bind x kill-pane

# Agent sidebar: open in every new window, prefix+A toggles it. Agents report
# state via ~/.config/tmux/agent-state.sh; looking at a finished agent's pane
# turns "done" back into "idle".
bind A run-shell "~/.config/tmux/agent-sidebar.sh toggle '#{window_id}'"
set-hook -g session-created "run-shell \"~/.config/tmux/agent-sidebar.sh toggle '#{window_id}'\""
set-hook -g after-new-window "run-shell \"~/.config/tmux/agent-sidebar.sh toggle '#{window_id}'\""
set-hook -g pane-focus-in 'if -F "#{==:#{@agent_state},done}" "set -p @agent_state idle"'

# Theme: Catppuccin Mocha, the plugin's default "basic" look, without the plugin.
source-file -F "#{d:current_file}/.config/tmux/catppuccin_mocha.conf"
set -g status-position top
set -g status-interval 5
set -g status-left-length 50
# Prefix pressed: bar and session block turn Mocha red.
set -gF status-style "bg=##{?client_prefix,#{@thm_red},#{@thm_mantle}},fg=#{@thm_fg}"
set -gF status-left "#[fg=#{@thm_crust},bg=##{?client_prefix,#{@thm_red},#{@thm_green}}] ##S #[default] "
set -gF status-right "#[fg=#{@thm_crust},bg=#{@thm_blue}] %H:%M "
set -gF window-status-format "#[fg=#{@thm_crust},bg=#{@thm_overlay_2}] ##I #[fg=#{@thm_fg},bg=#{@thm_surface_0}] ##W "
set -gF window-status-current-format "#[fg=#{@thm_crust},bg=#{@thm_mauve}] ##I #[fg=#{@thm_fg},bg=#{@thm_surface_1}] ##W "
set -g window-status-separator ""
set -gF window-status-bell-style "bg=#{@thm_yellow},fg=#{@thm_crust}"
set -gF pane-border-style "fg=#{@thm_overlay_0}"
set -gF pane-active-border-style "fg=#{@thm_lavender}"
set -gF message-style "fg=#{@thm_teal},bg=#{@thm_overlay_0}"
set -gF message-command-style "fg=#{@thm_teal},bg=#{@thm_overlay_0}"
set -gF mode-style "bg=#{@thm_surface_0},bold"
set -gF menu-selected-style "fg=#{@thm_fg},bold,bg=#{@thm_overlay_0}"
set -gF popup-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -gF popup-border-style "fg=#{@thm_surface_1}"
set -gF clock-mode-colour "#{@thm_blue}"
