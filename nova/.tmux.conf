# set-option -g default-shell /usr/bin/zsh
# =============================================================================
# PREFIX KEY
# =============================================================================
unbind C-b
set-option -g prefix `
bind-key ` send-prefix
set-option -g prefix2 C-x
bind-key C-x send-prefix -2

# =============================================================================
# GENERAL SETTINGS
# =============================================================================
set-option -g default-terminal "xterm-256color"
set-option -g mouse on
setw -g mode-keys vi
set -g base-index 1
set -g renumber-windows on
set -g status-position top
set -g allow-passthrough on
set -g escape-time 0
set -g repeat-time 1000
set -ga terminal-overrides ',*:RGB q:smcup@:rmcup@'

# =============================================================================
# NAVIGATION
# =============================================================================
bind-key H select-pane -L
bind-key L select-pane -R
bind-key K select-pane -U
bind-key J select-pane -D

# Toggle left pane between 30% and 70% (swap 30:70 <-> 70:30 split)
bind-key S run-shell -b "~/.dotfiles/scripts/tmux-swap-split.sh #{window_id}"

# Toggle left pane between lazygit and explorenova
bind-key e run-shell -b "~/.dotfiles/scripts/tmux-toggle-tree.sh"

# Clear screen binding
bind-key -n C-l send-keys C-l

# =============================================================================
# WINDOW & PANE MANAGEMENT
# =============================================================================
bind-key x kill-pane
bind-key X kill-session

# Open new window/panes in current pane's CWD
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# Reload config
bind R source-file '~/.tmux.conf' \; refresh-client

# =============================================================================
# COPY MODE
# =============================================================================
# Copy to system clipboard using wl-copy (Wayland)
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# =============================================================================
# PANE & BORDER 
# =============================================================================

set -g pane-border-lines simple
set -g pane-border-style fg=black,bright

# =============================================================================
# STATUS BAR
# =============================================================================
bind b set-option status
# Main status bar: very transparent grey
set -g status-style bg=default,fg=white
# Left side empty
set -g status-left ""
set -g status-left-length 100
# Right section: unchanged
set -g status-right " #{?client_prefix,#[fg=black bg=blue bold] PREFIX ,}#[fg=yellow,bg=colour235] #{?#{!=:#{pane_mode},},#{pane_mode},NORMAL} #[bg=default] #[fg=cyan,bg=colour235] #{session_name} "

# Window List
set -g status-right-length 80
set -g status-justify left
set -g window-status-format "#[fg=white,bg=colour238] #I:#W #[bg=default]"
set -g window-status-current-format "#[fg=black,bg=colour67,bold] #I:#W #[bg=default]"


# SESSION MANAGER
bind-key "s" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""
