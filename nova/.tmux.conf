# tmux config — minimal, built for agent orchestration.

# Prefixes: backtick (primary) and C-b (default). Double backtick types one.
set -g prefix '`'
set -g prefix2 C-b
bind '`' send-prefix

# Terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"
# Pass modified keys (Shift+Enter etc.) through to apps that ask for them.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ",xterm*:extkeys"
# Ctrl+Backspace arrives as C-BSpace and tmux would pass a plain backspace;
# send Ctrl-W (delete word) instead, like herdr.
bind -n C-BSpace send-keys C-w
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g set-clipboard on

# Numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi copy mode, yank to Wayland clipboard
setw -g mode-keys vi
# prefix+v: vi mode in this pane to scroll/search/copy its output (q or Esc leaves).
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Splits/windows open in current dir
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"

# Vim-style pane movement (h/l); j/k move between agents instead, like herdr.
bind h select-pane -L
bind l select-pane -R
bind j run-shell "~/.config/tmux/agent-sidebar.sh next '#{pane_id}'"
bind k run-shell "~/.config/tmux/agent-sidebar.sh prev '#{pane_id}'"

# Sessions, like herdr: N new (in current dir), D delete, J/K next/previous.
# Deleting a session moves the client to another one instead of detaching.
set -g detach-on-destroy off
# Server outlives its last session, so closing everything by hand can still be saved as empty.
set -g exit-empty off
bind N new-session -c "#{pane_current_path}"
bind D confirm-before -p "kill session #S? (y/n)" kill-session
bind J switch-client -n
bind K switch-client -p

bind r source-file ~/.tmux.conf \; display "reloaded"
bind R run-shell ~/.config/tmux/autoreload.sh
bind x kill-pane

# Agent sidebar: open in every new window, prefix+A toggles it. Agents report
# state via ~/.config/tmux/agent-state.sh; looking at a finished agent's pane
# turns "done" back into "idle".
bind A run-shell "~/.config/tmux/agent-sidebar.sh toggle '#{window_id}'"
# Persistence (state.sh): one JSON file (~/.local/share/tmux/state.json) rewritten
# on every create/close/rename below, on agent start/stop/conversation/folder
# changes (agent-state.sh) and on shell cd (zsh chpwd, fish PWD). No timer.
# The first session of a server restores it; agents resume their exact conversation.
set-hook -g session-created "run-shell \"~/.config/tmux/state.sh start '#{window_id}'\""
set-hook -g after-new-window "run-shell \"~/.config/tmux/agent-sidebar.sh open '#{window_id}'; ~/.config/tmux/state.sh save\""
set-hook -g after-split-window "run-shell '~/.config/tmux/state.sh save'"
set-hook -g window-resized "run-shell \"~/.config/tmux/agent-sidebar.sh resize '#{window_id}'\""
# Last real pane gone -> close the window (and the session with its last window).
set-hook -g pane-exited "run-shell \"~/.config/tmux/agent-sidebar.sh reap '#{window_id}'; ~/.config/tmux/state.sh save\""
set-hook -g after-kill-pane "run-shell \"~/.config/tmux/agent-sidebar.sh reap '#{window_id}'; ~/.config/tmux/state.sh save\""
set-hook -g window-unlinked "run-shell '~/.config/tmux/state.sh save'"
set-hook -g session-closed "run-shell '~/.config/tmux/state.sh save'"
set-hook -g session-renamed "run-shell '~/.config/tmux/state.sh save'"
set-hook -g after-rename-window "run-shell '~/.config/tmux/state.sh save'"
set-hook -g pane-focus-in 'if -F "#{==:#{@agent_state},done}" "set -p @agent_state idle"'

# Theme: Catppuccin Mocha, the plugin's default "basic" look, without the plugin.
source-file -F "#{d:current_file}/.config/tmux/catppuccin_mocha.conf"
set -g status-position top
set -g status-interval 5
set -g status-right-length 120
set -g status-justify left
# Tabs at the left end; system info (sysinfo.sh), clock, then session name at the right end.
# Prefix pressed: bar turns a muted dark blue, session block a lighter one.
set -gF status-style "bg=##{?client_prefix,#2a3450,#{@thm_mantle}},fg=#{@thm_fg}"
set -g status-left ""
set -gF status-right "#[fg=#{@thm_subtext_0}]##(~/.config/tmux/sysinfo.sh) #[fg=#{@thm_crust},bg=#{@thm_blue}] %H:%M #[fg=##{?client_prefix,#{@thm_fg},#{@thm_crust}},bg=##{?client_prefix,#45577f,#{@thm_green}}] ##S "
# Hostname in the middle (tells laptop and novahome apart). Reset first so a reload
# doesn't append it twice.
set -gu status-format
set -agF status-format[0] "#[align=absolute-centre fg=#{@thm_lavender},bold]##h#[default]"
# Window tabs show the active pane's folder, not the running command.
set -gF window-status-format "#[fg=#{@thm_crust},bg=#{@thm_overlay_2}] ##I #[fg=#{@thm_fg},bg=#{@thm_surface_0}] ##{b:pane_current_path} "
set -gF window-status-current-format "#[fg=#{@thm_crust},bg=#{@thm_mauve}] ##I #[fg=#{@thm_fg},bg=#{@thm_surface_1}] ##{b:pane_current_path} "
set -g window-status-separator ""
set -gF window-status-bell-style "bg=#{@thm_yellow},fg=#{@thm_crust}"
set -gF pane-border-style "fg=#{@thm_crust}"
set -gF pane-active-border-style "fg=#{@thm_crust}"
set -gF message-style "fg=#{@thm_teal},bg=#{@thm_overlay_0}"
set -gF message-command-style "fg=#{@thm_teal},bg=#{@thm_overlay_0}"
set -gF mode-style "bg=#{@thm_surface_0},bold"
set -gF menu-selected-style "fg=#{@thm_fg},bold,bg=#{@thm_overlay_0}"
set -gF popup-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -gF popup-border-style "fg=#{@thm_surface_1}"
set -gF clock-mode-colour "#{@thm_blue}"
