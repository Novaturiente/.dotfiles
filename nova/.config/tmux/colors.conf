# Tokyo Night — generated by scripts/theme.sh. Do not edit.
# Sourced from ~/.tmux.conf; layout lives there, only colours live here.

set -g pane-border-style fg='#292e42'
set -g pane-active-border-style fg='#bb9af7'

set -g status-style bg=default,fg='#c0caf5'
set -g status-right " #{?client_prefix,#[fg=#1a1b26 bg=#bb9af7 bold] PREFIX ,}#[fg=#e0af68,bg=#24283b] #{?#{!=:#{pane_mode},},#{pane_mode},NORMAL} #[bg=default] #[fg=#73daca,bg=#24283b] #{session_name} "
set -g window-status-format "#[fg=#9aa5ce,bg=#292e42] #I:#W #[bg=default]"
set -g window-status-current-format "#[fg=#1a1b26,bg=#bb9af7,bold] #I:#W #[bg=default]"
set -g message-style bg='#24283b',fg='#c0caf5'
set -g mode-style bg='#3b4261',fg='#c0caf5'
