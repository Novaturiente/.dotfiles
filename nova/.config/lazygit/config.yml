# Tokyo Night — generated by scripts/theme.sh. Do not edit.
# lazygit config
gui:
  theme:
    activeBorderColor:
      - '#bb9af7'
      - bold
    inactiveBorderColor:
      - '#9aa5ce'
    searchingActiveBorderColor:
      - '#e0af68'
    optionsTextColor:
      - '#7aa2f7'
    selectedLineBgColor:
      - '#24283b'
    inactiveViewSelectedLineBgColor:
      - '#414868'
    cherryPickedCommitFgColor:
      - '#bb9af7'
    cherryPickedCommitBgColor:
      - '#292e42'
    markedBaseCommitFgColor:
      - '#7aa2f7'
    markedBaseCommitBgColor:
      - '#e0af68'
    unstagedChangesColor:
      - '#f7768e'
    defaultFgColor:
      - '#c0caf5'
  # Accordion: only the focused side section is expanded; all others
  # collapse to a single title line (one expanded at a time).
  expandFocusedSidePanel: true
  expandedSidePanelWeight: 2
  # Files panel shows a collapsible file tree by default.
  showFileTree: true
  # Shrink the right main/diff panel to a sliver (lazygit has no option to
  # fully hide it). Side list gets the space; review real diffs in Neovim
  # via `e`. Default sidePanelWidth is 0.3333.
  sidePanelWidth: 0.5
  # Hide the bottom command log / extras panel by default
  showCommandLog: false

os:
  # Open files in Neovim in a NEW tmux window (lazygit stays in its
  # pane). editInTerminal false = lazygit does not grab the terminal; the
  # wrapper returns at once after spawning the tmux window. `o` uses the
  # same handler (plain `open`/xdg-open ran the editor without a TTY and
  # lazygit froze).
  edit: '~/.dotfiles/scripts/lazygit-edit.sh "{{filename}}"'
  editAtLine: '~/.dotfiles/scripts/lazygit-edit.sh "{{filename}}" {{line}}'
  editInTerminal: false
  open: '~/.dotfiles/scripts/lazygit-edit.sh "{{filename}}"'

# Catppuccin Mocha (mauve)
authorColors:
  '*': '#9d7cd8'
