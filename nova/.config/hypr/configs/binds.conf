# ============================
# General Keybindings (niri base)
# ============================
bind = SUPER, F5, submap, passthru
submap = passthru
bind = SUPER, Escape, submap, reset
submap = reset

# ============================
# System Controls
# ============================
bind = SUPER SHIFT, L, exec, dms ipc call lock lock
bind = SUPER SHIFT, E, exec, ~/.dotfiles/scripts/rofi/power.sh
bind = SUPER SHIFT, S, exec, grim -g "$(slurp)" - | satty -f - --copy-command 'wl-copy'
bind = SUPER, A, exec, grim -g "$(slurp)" - | satty -f - --copy-command 'wl-copy'
bind = , Print, exec, grim - | satty -f - --copy-command 'wl-copy'
bind = CTRL, Print, exec, grim - | satty -f - --copy-command 'wl-copy'
bind = ALT, Print, exec, grim -g "$(slurp -r)" - | satty -f - --copy-command 'wl-copy'
bind = SUPER, I, exec, ~/.dotfiles/scripts/idle.sh
bind = , XF86PowerOff, exec, systemctl suspend-then-hibernate
bind = SUPER CTRL SHIFT, P, exec, hyprctl dispatch dpms off
bind = CTRL ALT, Delete, exec, hyprctl dispatch exit

# ============================
# Application Launchers
# ============================
bind = SUPER, Return, exec, ghostty -e ~/.dotfiles/scripts/start_tmux.sh
bind = SUPER, Space, exec, ~/.dotfiles/scripts/rofi/tmux.sh
bind = SUPER, D, exec, rofi -show drun -theme spotlight
bind = SUPER SHIFT, D, exec, ~/.dotfiles/scripts/rofi/find.sh
bind = SUPER, E, exec, ghostty -e yazi
bind = SUPER, W, exec, qutebrowser
bind = SUPER CTRL, W, exec, qutebrowser --basedir ~/.config/qutebrowser_work
bind = SUPER CTRL SHIFT, W, exec, ~/.dotfiles/scripts/windows.sh
bind = SUPER, M, exec, emacs
bind = SUPER, N, exec, emacsclient -c
bind = SUPER SHIFT, N, exec, neovide
bind = SUPER, B, exec, ~/.dotfiles/scripts/rofi/bookmarks.sh
bind = SUPER, V, exec, ~/.dotfiles/scripts/rofi/clipboard.sh
bind = SUPER, O, exec, ~/.dotfiles/scripts/file_picker.sh
bind = SUPER SHIFT, O, exec, ~/.dotfiles/scripts/ocr_select.sh
bind = SUPER, G, exec, ~/.dotfiles/scripts/fix_grammar.sh
bind = SUPER SHIFT, X, exec, ~/.dotfiles/scripts/rofi/tools.sh
bind = SUPER SHIFT, B, exec, killall waybar || waybar
bind = SUPER CTRL, P, exec, scrcpy --max-fps 60 -Sw

# ============================
# Media Controls (niri: dms ipc + brightness.sh + swayosd)
# ============================
bind = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 5
bind = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 5
bind = , XF86AudioMute, exec, dms ipc call audio mute
bind = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bind = , Num_Lock, exec, sleep 0.3 && swayosd-client --num-lock
bind = , XF86MonBrightnessUp, exec, ~/.dotfiles/scripts/brightness.sh up
bind = , XF86MonBrightnessDown, exec, ~/.dotfiles/scripts/brightness.sh down

# Playback (keep if desired)
bind = SUPER SHIFT, C, exec, ~/.config/rofi/cast.sh
bind = SUPER SHIFT, P, exec, playerctl play-pause
bind = SUPER SHIFT, /, exec, playerctl next
bind = SUPER CTRL, /, exec, playerctl previous

# ============================
# Hyprpanel (optional)
# ============================
bind = ALT CTRL, S, exec, hyprpanel toggleWindow settings-dialog
bind = ALT CTRL, D, exec, hyprpanel toggleWindow dashboardmenu
bind = ALT CTRL, N, exec, hyprpanel toggleWindow notificationsmenu
bind = ALT CTRL, E, exec, hyprpanel toggleWindow powerdropdownmenu
bind = ALT CTRL, W, exec, hyprpanel toggleWindow networkmenu

# ============================
# Miscellaneous
# ============================
bind = SUPER SHIFT, M, exec, ~/monitor
bind = SUPER, Alt, R, exec, ~/.dotfiles/scripts/record-script.sh
bind = CTRL ALT, R, exec, ~/.dotfiles/scripts/record-script.sh --fullscreen
bind = SUPER SHIFT ALT, R, exec, ~/.dotfiles/scripts/record-script.sh --fullscreen-sound

# ============================
# Special Workspaces (Scratchpads)
# ============================
bind = SUPER, minus, movetoworkspace, special
bind = SUPER SHIFT, minus, movetoworkspace, e+1
bind = SUPER, equal, togglespecialworkspace, special
bind = SUPER, F1, togglespecialworkspace, scratchpad
bind = SUPER ALT, F1, movetoworkspacesilent, special:scratchpad

# ============================
# Window Management
# ============================
bind = SUPER, Q, killactive
bind = SUPER SHIFT, F, togglefloating
bind = SUPER, P, pseudo
bind = SUPER, F, fullscreen, 1
bind = SUPER CTRL, F, fullscreen

# ============================
# Window Resizing
# ============================
bind = SUPER SHIFT, R, submap, resize
submap = resize
    bind = , right, resizeactive, 15 0
    bind = , left, resizeactive, -15 0
    bind = , up, resizeactive, 0 -15
    bind = , down, resizeactive, 0 15
    bind = , l, resizeactive, 15 0
    bind = , h, resizeactive, -15 0
    bind = , k, resizeactive, 0 -15
    bind = , j, resizeactive, 0 15
    bind = , escape, submap, reset
submap = reset
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# ============================
# Window Focus Movement
# ============================
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER, h, movefocus, l
bind = SUPER, l, movefocus, r
bind = SUPER, k, movefocus, u
bind = SUPER, j, movefocus, d

# ============================
# Window Movement
# ============================
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d
bind = SUPER SHIFT, h, movewindow, l
bind = SUPER SHIFT, l, movewindow, r
bind = SUPER SHIFT, k, movewindow, u
bind = SUPER SHIFT, j, movewindow, d

# ============================
# Workspace Management
# ============================
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1
bind = SUPER CTRL, right, workspace, e+1
bind = SUPER CTRL, left, workspace, e-1
