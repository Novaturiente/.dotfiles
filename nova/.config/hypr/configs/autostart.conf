# Autostart Applications (niri base)
exec-once = dbus-update-activation-environment --all
exec-once = sleep 1 && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Polkit (match niri)
exec-once = /usr/lib/mate-polkit/polkit-mate-authentication-agent-1

# Idle (match niri: swayidle)
exec-once = swayidle

# IME (match niri: ibus)
exec-once = ibus-daemon -drx

# Wallpaper (match niri)
exec-once = ~/.dotfiles/scripts/wallpaper.sh

# Clipboard (match niri: cliphist)
exec-once = wl-paste --watch cliphist store --max-items 100 &

# KDE Connect (match niri)
exec-once = systemctl --user start kdeconnect
exec-once = kdeconnect-indicator

# Tray / system
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = udiskie --tray --notify

# Cursor theme (match niri)
exec-once = hyprctl setcursor Bibata-Modern-Classic 24

# Optional
# exec-once = waybar
exec-once = hyprshade on vibrance-custom

# Portals (Hyprland)
exec-once = systemctl --user start xdg-desktop-portal-hyprland
exec-once = systemctl --user start xdg-desktop-portal
exec-once = systemctl --user start xdg-desktop-portal-gtk

# Background / one-shots (match niri)
exec-once = emacs --daemon
exec-once = ~/.dotfiles/scripts/start_tmux.sh
exec-once = bash -c 'sshfs nova@novahome:/home/nova /home/nova/server -o reconnect,ServerAliveInterval=15,ServerAliveCountMax=3' &

exec-once = hyprpm reload -n
