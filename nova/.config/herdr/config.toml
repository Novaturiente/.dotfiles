onboarding = false
# Place this file at ~/.config/herdr/config.toml
# Deployed via stow from ~/.dotfiles. Reload running server with:
#   herdr server reload-config

[keys]
# herdr supports a single prefix key only (no array).
prefix = "ctrl+b"

# Pane focus — direct alt chords, no prefix needed
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"

# Workspace picker (workspace navigation)
workspace_picker = "prefix+w"

# Move between agents
next_agent = "prefix+j"
previous_agent = "prefix+k"

[[keys.command]]
key = "prefix+O"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

[ui.toast]
delivery = "herdr"

[ui]
agent_panel_sort = "spaces"

# Client-side: enables local Kitty graphics, required for clipboard image paste
# into a remote session. remote_image_paste already defaults to ctrl+v.
[experimental]
kitty_graphics = true
