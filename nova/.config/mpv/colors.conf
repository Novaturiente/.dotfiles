# Tokyo Night — generated by scripts/theme.sh. Do not edit.
# Pulled in from mpv.conf with `include=`.

background-color='#1a1b26'
osd-back-color='#0c0e14'
osd-border-color='#0c0e14'
osd-color='#c0caf5'
osd-shadow-color='#1a1b26'

# Stats script wants BBGGRR, not RRGGBB.
script-opts-append=stats-border_color=1e1616
script-opts-append=stats-font_color=f5cac0
script-opts-append=stats-plot_bg_border_color=f79abb
script-opts-append=stats-plot_bg_color=1e1616
script-opts-append=stats-plot_color=f79abb

# UOSC
script-opts-append=uosc-color=foreground=bb9af7,foreground_text=24283b,background=1a1b26,background_text=c0caf5,curtain=16161e,success=9ece6a,error=f7768e
