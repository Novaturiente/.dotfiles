# Force hardware decoding with Intel iGPU
hwdec=vaapi
vo=gpu
gpu-context=wayland   # if using Wayland (Hyprland)

# Main mpv options
# Colours come from colors.conf, generated by scripts/theme.sh.
include=~~/colors.conf


# External script options
# It is fine to leave these here even if one does not use these scripts because they are just ignored unless a script uses them

