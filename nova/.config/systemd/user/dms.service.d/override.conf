# DankMaterialShell no longer owns org.freedesktop.Notifications; the
# quickshell-notifications unit does. The shipped unit is Type=dbus with
# BusName=org.freedesktop.Notifications, so systemd would wait ninety seconds for a
# name DMS can never acquire, fail the start, and then restart it on a loop.
#
# Type=simple makes systemd treat DMS as started once the process is running.
# BusName= is left as shipped because systemd rejects an empty value and only
# consults it for Type=dbus.
#
# Everything else about DMS is untouched: the bar, lock screen, OSD, dash and
# control centre all still work. Only its notification server goes quiet, which
# also leaves its notification centre on Mod+N permanently empty.
[Unit]
After=quickshell-notifications.service

[Service]
Type=simple
