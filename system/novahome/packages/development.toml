# novahome: shell and web-development toolchain for novacode sessions over SSH
# (the laptop's terminal-tools and development lists, minus anything graphical).
packages = [
  # Shell (nova/.zshrc and .tmux.conf are stowed from this repo)
  "zsh",
  "tmux",
  "herdr-bin",
  "neovim",
  "vim",
  "nano",
  "stow",
  "git",
  "github-cli",
  "lazygit",
  "atuin",
  "zoxide",
  "fzf",
  "eza",
  "ripgrep",
  "fd",
  "bat",
  "jq",
  "carapace-bin",
  "television",
  "btop",
  "htop",
  "nvtop",
  "fastfetch",
  "gdu",
  "duf",
  "lsof",
  "pv",
  "tree",
  "trash-cli",
  "sshfs",
  "pass",
  "7zip",
  "zip",
  "unzip",
  "unrar",

  # Languages and build tools
  "pkgconf",
  "cmake",
  "meson",
  "ninja",
  "nodejs-lts-jod",
  "npm",
  "pnpm",
  "bun",
  "uv",
  "go",
  "rustup",
  "lua",
  "luarocks",

  # Editor support (neovim LSPs, formatters, treesitter)
  "tree-sitter-cli",
  "rust-analyzer",
  "pyright",
  "python-pynvim",
  "python-ruff",
  "bash-language-server",
  "shfmt",
  "shellcheck-bin",
  "prettier",

  # Headless browser testing (Xvfb display for Playwright-style runs)
  "xorg-server-xvfb",
]
