# ${THEME_LABEL} — generated by scripts/theme.sh. Do not edit.
# Read by Omamail, which looks for Omarchy's palette here. Its parser is flat
# "key = value" only: a TOML [section] header fails the whole file and silently
# drops the app back to its built-in Tokyo Night palette.
#
# background/foreground are the dimmer pair and bright_foreground the brighter
# one, matching how Omamail's own fallback palette is built.

mode = "${THEME_POLARITY}"

background = "#${BASE}"
foreground = "#${SUBTEXT1}"
accent = "#${ACCENT}"

red = "#${RED}"
yellow = "#${YELLOW}"
green = "#${GREEN}"

lighter_background = "#${SURFACE0}"
dark_background = "#${MANTLE}"
bright_foreground = "#${TEXT}"
selection = "#${SURFACE1}"
muted = "#${OVERLAY0}"
