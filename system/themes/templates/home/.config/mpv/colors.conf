# ${THEME_LABEL} — generated by scripts/theme.sh. Do not edit.
# Pulled in from mpv.conf with `include=`.

background-color='#${BASE}'
osd-back-color='#${CRUST}'
osd-border-color='#${CRUST}'
osd-color='#${TEXT}'
osd-shadow-color='#${BASE}'

# Stats script wants BBGGRR, not RRGGBB.
script-opts-append=stats-border_color=${MANTLE_BGR}
script-opts-append=stats-font_color=${TEXT_BGR}
script-opts-append=stats-plot_bg_border_color=${ACCENT_BGR}
script-opts-append=stats-plot_bg_color=${MANTLE_BGR}
script-opts-append=stats-plot_color=${ACCENT_BGR}

# UOSC
script-opts-append=uosc-color=foreground=${ACCENT},foreground_text=${SURFACE0},background=${BASE},background_text=${TEXT},curtain=${MANTLE},success=${GREEN},error=${RED}
