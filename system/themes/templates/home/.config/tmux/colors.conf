# ${THEME_LABEL} — generated by scripts/theme.sh. Do not edit.
# Sourced from ~/.tmux.conf; layout lives there, only colours live here.

set -g pane-border-style fg='#${SURFACE1}'
set -g pane-active-border-style fg='#${ACCENT}'

set -g status-style bg=default,fg='#${TEXT}'
set -g status-right " #{?client_prefix,#[fg=#${ACCENT_TEXT} bg=#${ACCENT} bold] PREFIX ,}#[fg=#${YELLOW},bg=#${SURFACE0}] #{?#{!=:#{pane_mode},},#{pane_mode},NORMAL} #[bg=default] #[fg=#${TEAL},bg=#${SURFACE0}] #{session_name} "
set -g window-status-format "#[fg=#${SUBTEXT0},bg=#${SURFACE1}] #I:#W #[bg=default]"
set -g window-status-current-format "#[fg=#${ACCENT_TEXT},bg=#${ACCENT},bold] #I:#W #[bg=default]"
set -g message-style bg='#${SURFACE0}',fg='#${TEXT}'
set -g mode-style bg='#${SURFACE2}',fg='#${TEXT}'
