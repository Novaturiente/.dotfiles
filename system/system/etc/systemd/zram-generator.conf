# zram is off: zswap (enabled by /etc/tmpfiles.d/zswap.conf) caches swap in
# front of /swap/swapfile instead. With zram, cold pages filled it and newer
# pages spilled straight to disk, causing freezes. This file must stay (empty
# of devices): deleting it falls back to cachyos-settings'
# /usr/lib/systemd/zram-generator.conf, which turns zram back on.
